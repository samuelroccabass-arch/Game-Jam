<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMap Brasil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-ponto-card: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --header-bg: #15803d;
            --header-text: #ffffff;
            --btn-primary: #16a34a;
            --btn-primary-hover: #15803d;
            --btn-gps: #0284c7;
            --btn-gps-hover: #0369a1;
            --map-filter: none;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-ponto-card: #0f172a;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --header-bg: #14532d;
            --header-text: #f8fafc;
            --btn-primary: #22c55e;
            --btn-primary-hover: #16a34a;
            --btn-gps: #38bdf8;
            --btn-gps-hover: #0284c7;
            --map-filter: brightness(0.85) invert(0.8) contrast(1.1) hue-rotate(180deg);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header limpo e corporativo */
        .header {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header p {
            font-size: 0.85rem;
            opacity: 0.9;
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 650px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .busca-box {
            display: flex;
            gap: 6px;
            flex: 1;
            max-width: 420px;
        }

        .busca-box input {
            width: 100%;
            padding: 8px 14px;
            border: 1px solid transparent;
            border-radius: 6px;
            font-size: 0.88rem;
            outline: none;
            color: #0f172a;
            background: #ffffff;
        }

        .busca-box input:focus {
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
        }

        .btn-acao {
            padding: 8px 16px;
            background-color: var(--btn-primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-acao:hover { background-color: var(--btn-primary-hover); }

        .btn-gps {
            background-color: var(--btn-gps);
        }
        .btn-gps:hover { background-color: var(--btn-gps-hover); }

        .toggle-theme-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .toggle-theme-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Container Principal */
        .main-container {
            max-width: 1400px;
            width: 100%;
            margin: 20px auto;
            padding: 0 24px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            flex: 1;
        }

        /* Card do Mapa */
        .map-card {
            flex: 2;
            min-width: 320px;
            height: calc(100vh - 120px);
            min-height: 500px;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        #mapa { width: 100%; height: 100%; }
        .leaflet-tile-container img { filter: var(--map-filter); }

        /* Painel Lateral da Lista */
        .painel-lista {
            flex: 1;
            min-width: 320px;
            height: calc(100vh - 120px);
            min-height: 500px;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .painel-header {
            margin-bottom: 16px;
        }

        .painel-lista h2 {
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .filtros-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .filtros-container::-webkit-scrollbar { display: none; }

        .btn-filtro {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
        }

        .btn-filtro.ativo {
            background: var(--text-primary);
            color: var(--bg-card);
            border-color: var(--text-primary);
        }

        .lista-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
        }

        /* Cards da lista */
        .card-ponto {
            background: var(--bg-ponto-card);
            border: 1px solid var(--border-color);
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .card-ponto:hover {
            border-color: var(--btn-primary);
        }

        .card-header-flex {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 6px;
        }

        .numero-badge {
            background: var(--header-bg);
            color: white;
            font-weight: 700;
            font-size: 0.75rem;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .card-ponto h3 {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 600;
            line-height: 1.3;
        }

        .distancia-badge {
            display: inline-block;
            color: var(--btn-gps);
            font-weight: 600;
            font-size: 0.75rem;
            margin-bottom: 6px;
        }

        .cidade-texto {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .tag {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 500;
        }

        .btn-rota {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 10px;
            background: var(--btn-gps);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .btn-rota:hover { background: var(--btn-gps-hover); }

        .empty-state {
            text-align: center;
            padding: 60px 15px;
            color: var(--text-secondary);
        }

        .empty-state div { font-size: 2rem; margin-bottom: 8px; opacity: 0.7; }
        .empty-state p { font-size: 0.85rem; }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-content">
            <div class="header-title-box">
                <h1>🌱 EcoMap Brasil</h1>
                <p>Descarte sustentável próximo de você</p>
            </div>
            
            <div class="header-actions">
                <div class="busca-box">
                    <input type="text" id="inputEndereco" placeholder="Cidade ou bairro..." onkeypress="tratarEnter(event)">
                    <button class="btn-acao" onclick="buscarPontos()">Buscar</button>
                </div>
                <button class="btn-acao btn-gps" onclick="usarGPS()">📍 GPS</button>
                <button class="toggle-theme-btn" onclick="alternarTema()">
                    <span id="themeIcon">🌙</span> <span id="themeText">Escuro</span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="map-card">
            <div id="mapa"></div>
        </div>

        <aside class="painel-lista">
            <div class="painel-header">
                <h2>Ecopontos Próximos</h2>
                <div class="filtros-container">
                    <button class="btn-filtro ativo" onclick="filtrarMaterial('todos', this)">Todos</button>
                    <button class="btn-filtro" onclick="filtrarMaterial('Plástico', this)">🥤 Plástico</button>
                    <button class="btn-filtro" onclick="filtrarMaterial('Vidro', this)">🍾 Vidro</button>
                    <button class="btn-filtro" onclick="filtrarMaterial('Papel', this)">📦 Papel</button>
                    <button class="btn-filtro" onclick="filtrarMaterial('Metal', this)">🥫 Metal</button>
                </div>
            </div>
            <div id="listaPontos" class="lista-scroll">
                <div class="empty-state">
                    <div>🔍</div>
                    <p>Digite um local ou use o GPS para visualizar as opções.</p>
                </div>
            </div>
        </aside>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const mapa = L.map('mapa').setView([-14.2350, -51.9253], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(mapa);

        let marcadores = [];
        let todosPontos = [];
        let materialAtual = 'todos';

        function obterIconeMaterial(material) {
            const m = material.toLowerCase();
            if (m.includes("vidro")) return "🍾";
            if (m.includes("plástico") || m.includes("plastico")) return "🥤";
            if (m.includes("papel") || m.includes("papelão")) return "📦";
            if (m.includes("metal") || m.includes("lata")) return "🥫";
            if (m.includes("eletrôn")) return "💻";
            if (m.includes("pilha") || m.includes("bateria")) return "🔋";
            if (m.includes("óleo") || m.includes("oleo")) return "🛢️";
            if (m.includes("roupa") || m.includes("têxtil")) return "👕";
            if (m.includes("entulho")) return "🧱";
            return "♻️";
        }

        function alternarTema() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeIcon').innerText = newTheme === 'dark' ? '☀️' : '🌙';
            document.getElementById('themeText').innerText = newTheme === 'dark' ? 'Claro' : 'Escuro';
        }

        function tratarEnter(e) {
            if (e.key === 'Enter') buscarPontos();
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        async function buscarPontos() {
            const input = document.getElementById('inputEndereco');
            const endereco = input.value.trim();
            if (!endereco) return alert("Por favor, digite um endereço!");

            executarBusca(`/buscar?endereco=${encodeURIComponent(endereco)}`);
        }

        function usarGPS() {
            if (!navigator.geolocation) {
                alert("Geolocalização não suportada.");
                return;
            }

            const divLista = document.getElementById('listaPontos');
            divLista.innerHTML = `<div class="empty-state"><div>📡</div><p>Obtendo localização GPS...</p></div>`;

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    executarBusca(`/buscar_coords?lat=${pos.coords.latitude}&lng=${pos.coords.longitude}`);
                },
                () => {
                    alert("Permissão de GPS negada.");
                    divLista.innerHTML = `<div class="empty-state"><div>⚠️</div><p>GPS indisponível.</p></div>`;
                }
            );
        }

        async function executarBusca(url) {
            marcadores.forEach(m => mapa.removeLayer(m));
            marcadores = [];

            const divLista = document.getElementById('listaPontos');
            divLista.innerHTML = `<div class="empty-state"><div>⏳</div><p>Buscando ecopontos...</p></div>`;

            try {
                const res = await fetch(url);
                const dados = await res.json();

                if (dados.erro) {
                    divLista.innerHTML = `<div class="empty-state"><div>⚠️</div><p>${dados.erro}</p></div>`;
                    return;
                }

                mapa.setView([dados.lat_usuario, dados.lng_usuario], 13);

                const userMarker = L.marker([dados.lat_usuario, dados.lng_usuario]).addTo(mapa)
                    .bindPopup("<b>📍 Você está aqui</b>").openPopup();
                marcadores.push(userMarker);

                if (!dados.pontos || dados.pontos.length === 0) {
                    divLista.innerHTML = `<div class="empty-state"><div>📦</div><p>Nenhum ponto registrado nessa área.</p></div>`;
                    return;
                }

                dados.pontos.forEach(ponto => {
                    ponto.distancia = calcularDistancia(dados.lat_usuario, dados.lng_usuario, ponto.lat, ponto.lng);
                });
                dados.pontos.sort((a, b) => a.distancia - b.distancia);

                todosPontos = dados.pontos;
                renderizarListaEPinos();

            } catch (err) {
                console.error(err);
                divLista.innerHTML = `<div class="empty-state"><div>❌</div><p>Erro de conexão com o servidor.</p></div>`;
            }
        }

        function filtrarMaterial(material, btn) {
            materialAtual = material;
            document.querySelectorAll('.btn-filtro').forEach(b => b.classList.remove('ativo'));
            btn.classList.add('ativo');
            renderizarListaEPinos();
        }

        function renderizarListaEPinos() {
            while (marcadores.length > 1) {
                mapa.removeLayer(marcadores.pop());
            }

            const divLista = document.getElementById('listaPontos');
            divLista.innerHTML = "";

            const pontosFiltrados = materialAtual === 'todos' 
                ? todosPontos 
                : todosPontos.filter(p => p.materiais.some(m => m.toLowerCase().includes(materialAtual.toLowerCase())));

            if (pontosFiltrados.length === 0) {
                divLista.innerHTML = `<div class="empty-state"><div>🔍</div><p>Nenhum ecoponto para "${materialAtual}".</p></div>`;
                return;
            }

            pontosFiltrados.forEach((ponto, index) => {
                const numero = index + 1;
                const distFormatada = ponto.distancia < 1 
                    ? `${Math.round(ponto.distancia * 1000)}m` 
                    : `${ponto.distancia.toFixed(1)} km`;

                const tagsHtml = ponto.materiais.map(m => {
                    return `<span class="tag">${obterIconeMaterial(m)} ${m}</span>`;
                }).join('');

                const urlGoogleMaps = `https://www.google.com/maps/dir/?api=1&destination=${ponto.lat},${ponto.lng}`;

                const m = L.marker([ponto.lat, ponto.lng]).addTo(mapa);
                
                m.bindPopup(`
                    <div style="font-family: 'Plus Jakarta Sans', sans-serif;">
                        <b style="color: #15803d;">#${numero} - ${ponto.nome}</b><br>
                        <small>📏 a ${distFormatada} de você</small><br><br>
                        <b>Materiais aceitos:</b><br>${tagsHtml}<br>
                        <a href="${urlGoogleMaps}" target="_blank" class="btn-rota">🗺️ Como Chegar</a>
                    </div>
                `);

                marcadores.push(m);

                const card = document.createElement('div');
                card.className = 'card-ponto';
                card.innerHTML = `
                    <div class="card-header-flex">
                        <span class="numero-badge">${numero}</span>
                        <h3>${ponto.nome}</h3>
                    </div>
                    <div class="distancia-badge">📏 a ${distFormatada}</div>
                    <div class="cidade-texto">${ponto.cidade}</div>
                    <div class="tags-container">${tagsHtml}</div>
                `;

                card.onclick = () => {
                    mapa.setView([ponto.lat, ponto.lng], 15);
                    m.openPopup();
                };

                divLista.appendChild(card);
            });
        }
    </script>
</body>
</html>
